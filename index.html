<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Precision and Recall</title>
  <link rel="stylesheet" href="styles.css?v=4">
  <script>
    // Apply the saved light or dark choice before the page draws, so it never flashes.
    try { const t = localStorage.getItem("pr-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <span class="brand">Precision and Recall</span>
      <span id="progress" class="progress"></span>
      <button id="themeBtn" class="theme-btn" type="button">
        <svg class="icon icon-auto" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
        <svg class="icon icon-light" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M4 16l1.4-1.4M14.6 5.4 16 4"/></g></svg>
        <svg class="icon icon-dark" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9z" fill="currentColor"/></svg>
        <span class="theme-label">Auto</span>
      </button>
      <button id="leaveBtn" class="link-btn leave" hidden>Leave for now</button>
    </div>
    <nav id="steps" class="steps" aria-label="Progress through the module" hidden></nav>
  </header>
  <main id="app" class="card" tabindex="-1" aria-live="polite"></main>

  <dialog id="leaveDialog">
    <form method="dialog" id="leaveForm">
      <h2>Leaving for now?</h2>
      <p>Your place is saved. Before you go, what made you stop? (optional)</p>
      <textarea id="leaveReason" rows="3" placeholder="For example: out of time, too easy, confusing slide"></textarea>
      <div class="row">
        <button value="cancel" class="secondary">Keep going</button>
        <button value="leave" class="primary">Save and leave</button>
      </div>
    </form>
  </dialog>

  <script src="content.js?v=4"></script>
  <script src="config.js?v=4"></script>
  <script src="store.js?v=4"></script>
  <script src="visuals.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
